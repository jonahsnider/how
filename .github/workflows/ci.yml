name: CI

on: [push, pull_request]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: fish-shop/install-fish-shell@c7854a53788db0cf0ac377b7320e6814b6078d3f # v2
      - uses: fish-shop/install-plugin@98793e65533c5e0c2935c585b62af092d00f576c # v2
        with:
          plugin-manager: fisher
          plugins: .
      - parallel:
          - uses: fish-shop/syntax-check@3a54bf1d05cbcb385ee49fa581eca0df7f496112 # v2
          - uses: fish-shop/indent-check@c7f2aac836e4c56bec3a6ac4f52d0e7ddbcae540 # v2
          - uses: fish-shop/run-fishtape-tests@de5af34466faa5c1eb73465dd84fd1f0998f69b6 # v2
            with:
              patterns: tests/**.fish
