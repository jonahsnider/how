name: CI

on: [push, pull_request]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: fish-shop/install-fish-shell@e9b65608796ecab62e15c39a0398b66837d0cf9a # v2
      - uses: fish-shop/install-plugin@20e60d7c76865cdc5bf8625bdd78f8e2cb344b57 # v2
        with:
          plugin-manager: fisher
          plugins: .
      - parallel:
          - uses: fish-shop/syntax-check@4b4b90a05c6b7063e07ff8c3e2e67e928a4db9f6 # v2
          - uses: fish-shop/indent-check@624a767d056d069e790618bf1024c45c5cd9edea # v2
          - uses: fish-shop/run-fishtape-tests@10f221910ba27a421af41eb7c67ad3c480353fe7 # v2
            with:
              patterns: tests/**.fish
