name: CI

on: [push, pull_request]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: fish-shop/install-fish-shell@31111fa6eb327c8cab72ea9b3b7cca4c27b9c076 # v2
      - uses: fish-shop/install-plugin@55eea954f2aed8bb0fbb16cd3ff24abd3dffbe78 # v2
        with:
          plugin-manager: fisher
          plugins: .
      - parallel:
          - uses: fish-shop/syntax-check@8ab25d368e519c70da7270bd91bec6d0aed433bb # v2
          - uses: fish-shop/indent-check@e5f338ce940d3271791e4ebc7390a28e5639d97f # v2
          - uses: fish-shop/run-fishtape-tests@4888e1f15b4f53b87d874e0c2da729d16752bba7 # v2
            with:
              patterns: tests/**.fish
