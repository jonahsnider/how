name: CI

on: [push, pull_request]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: fish-shop/install-fish-shell@e9b65608796ecab62e15c39a0398b66837d0cf9a # v2
      - uses: fish-shop/install-plugin@55eea954f2aed8bb0fbb16cd3ff24abd3dffbe78 # v2
        with:
          plugin-manager: fisher
          plugins: .
      - parallel:
          - uses: fish-shop/syntax-check@e73305a5340afe528f22242e1648db241279f9d4 # v2
          - uses: fish-shop/indent-check@624a767d056d069e790618bf1024c45c5cd9edea # v2
          - uses: fish-shop/run-fishtape-tests@4888e1f15b4f53b87d874e0c2da729d16752bba7 # v2
            with:
              patterns: tests/**.fish
