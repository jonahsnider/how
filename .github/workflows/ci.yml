name: CI

on: [push, pull_request]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: fish-shop/install-fish-shell@b93ff71cb0566d1d461927fd0f182ae7a777a8d6 # v2
      - uses: fish-shop/install-plugin@39273f573fdcbb30892834e1d5b75e3727b10d03 # v2
        with:
          plugin-manager: fisher
          plugins: .
      - parallel:
          - uses: fish-shop/syntax-check@8ab25d368e519c70da7270bd91bec6d0aed433bb # v2
          - uses: fish-shop/indent-check@73078636eddc9a17cafcf779ba5d49924c196e21 # v2
          - uses: fish-shop/run-fishtape-tests@265f30c3b8998c6f77b250c1d6ba2bbb5962c0bf # v2
            with:
              patterns: tests/**.fish
