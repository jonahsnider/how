name: CI

on: [push, pull_request]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: fish-shop/install-fish-shell@6457fc454bc52bcd0e657eeb5b3c5ba41ae8ad3e # v2
      - uses: fish-shop/install-plugin@3d86cc2f1c2c71250716eed27875976c38155b62 # v2
        with:
          plugin-manager: fisher
          plugins: .
      - parallel:
          - uses: fish-shop/syntax-check@3a54bf1d05cbcb385ee49fa581eca0df7f496112 # v2
          - uses: fish-shop/indent-check@92975460e948f1d9dd93f542491706ec4d541ff9 # v2
          - uses: fish-shop/run-fishtape-tests@43b770376992aab239e54af2dd4f61f21a1ba571 # v2
            with:
              patterns: tests/**.fish
